<style>
  :root{
    color-scheme:dark;
    --bg:#0A0F1C;
    --fg:#EAEEF7;
    --muted:#8B95AC;
    --amber:#FFB454;
    --line:#1C2740;
    --maxw:600px;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  html,body{ margin:0; }
  body{
    background:var(--bg);
    color:var(--fg);
    font-family:"Sora",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:grid;
    justify-items:center;
    align-content:safe center;
    min-height:100vh;
    min-height:100svh;
    padding:
      max(40px, env(safe-area-inset-top))
      max(26px, env(safe-area-inset-right))
      max(40px, env(safe-area-inset-bottom))
      max(26px, env(safe-area-inset-left));
    overflow-x:hidden;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  .stack{ width:100%; max-width:var(--maxw); text-align:center; }

  .scope{
    position:relative;
    height:clamp(104px, 16vh, 152px);
    margin:0 0 clamp(22px, 4vw, 32px);
  }
  .scope canvas{ display:block; width:100%; height:100%; }
  .scope::after{ /* faint centreline */
    content:""; position:absolute; left:0; right:0; top:50%; height:1px;
    background:var(--line); z-index:-1;
  }
  .readout{
    position:absolute; top:4px; left:0;
    font-family:"Space Mono",ui-monospace,monospace;
    font-size:clamp(9.5px, 2.4vw, 11px); letter-spacing:.22em; color:var(--muted);
  }
  .readout .live{ color:var(--amber); }

  .name{
    font-weight:200;
    font-size:clamp(2.3rem, 8.4vw, 4.4rem);
    line-height:1.04; letter-spacing:-.01em; margin:0;
  }
  .name b{ font-weight:600; }

  .roles{
    color:var(--muted); font-weight:300;
    font-size:clamp(.84rem, 3vw, 1.02rem); letter-spacing:.03em;
    margin:clamp(14px, 3vw, 20px) 0 0; line-height:1.5;
  }
  .roles span{ white-space:nowrap; }
  .dot{ color:var(--amber); padding:0 .5em; }

  .links{
    list-style:none; padding:0; margin:clamp(26px, 5vw, 36px) 0 0;
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:clamp(4px, 1.4vw, 8px) clamp(20px, 4.6vw, 32px);
  }
  .links a{
    color:var(--fg); text-decoration:none; font-weight:300;
    font-size:clamp(.9rem, 2.6vw, .95rem); letter-spacing:.02em;
    position:relative; display:inline-block; padding:9px 4px;
    transition:color .18s ease;
  }
  .links a:active{ color:var(--amber); }
  .links a:focus-visible{ outline:2px solid var(--amber); outline-offset:4px; border-radius:2px; }

  /* animated underline for pointer (hover) devices */
  @media (hover:hover){
    .links a::after{
      content:""; position:absolute; left:4px; right:4px; bottom:5px; height:1px;
      background:var(--amber); transform:scaleX(0); transform-origin:left;
      transition:transform .22s ease;
    }
    .links a:hover{ color:var(--amber); }
    .links a:hover::after{ transform:scaleX(1); }
  }
  /* persistent affordance for touch devices */
  @media (hover:none){
    .links a{
      text-decoration:underline; text-decoration-thickness:1px;
      text-underline-offset:5px; text-decoration-color:rgba(255,180,84,.4);
    }
  }

  footer{
    font-family:"Space Mono",ui-monospace,monospace;
    font-size:clamp(9.5px, 2.4vw, 10.5px); letter-spacing:.18em; color:var(--muted);
    margin-top:clamp(34px, 6vw, 46px);
  }

  @media (prefers-reduced-motion: reduce){
    .links a, .links a::after{ transition:none; }
  }

<body>
  <main class="stack">
    <div class="scope">
      <span class="readout" aria-hidden="true">9H5BB <span class="live">&bull;</span> MALTA</span>
      <canvas id="wave" aria-hidden="true"></canvas>
    </div>

    <h1 class="name">Norbert <b>Bonnici</b></h1>

  <script>
    document.querySelectorAll('[data-year]').forEach(function(el){ el.textContent = new Date().getFullYear(); });

    (function(){
      var canvas = document.getElementById('wave');
      var ctx = canvas.getContext('2d');
      var amber = '#FFB454';
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      var dpr = 1, w = 0, h = 0, t = 0, raf = null;
      var last = 0, fpsInterval = 1000 / 40, SPEED = 3.0;

      function resize(){
        dpr = Math.min(window.devicePixelRatio || 1, 2);
        w = canvas.clientWidth; h = canvas.clientHeight;
        canvas.width = Math.round(w * dpr);
        canvas.height = Math.round(h * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        draw();
      }

      function draw(){
        ctx.clearRect(0, 0, w, h);
        var mid = h / 2;
        var amp = h * 0.30;
        ctx.lineWidth = 2;
        ctx.strokeStyle = amber;
        ctx.shadowColor = 'rgba(255,180,84,0.45)';
        ctx.shadowBlur = 10;
        ctx.beginPath();
        for(var px = 0; px <= w; px++){
          var u = px / w;
          // two-tone FSK feel: carrier frequency steps between segments across the width
          var seg = Math.sin(u * Math.PI * 6 + t * 0.6);
          var freq = seg > 0 ? 11 : 22;
          var env = 0.55 + 0.45 * Math.sin(u * Math.PI);   // amplitude envelope, fades at edges
          var y = Math.sin(u * freq * 2 * Math.PI + t) * env;
          var yy = mid + y * amp;
          if(px === 0) ctx.moveTo(px, yy); else ctx.lineTo(px, yy);
        }
        ctx.stroke();
      }

      function loop(ts){
        raf = requestAnimationFrame(loop);
        if(ts - last < fpsInterval) return;
        var delta = last ? (ts - last) / 1000 : 0.016;
        last = ts;
        t += delta * SPEED;
        draw();
      }
      function start(){ if(!reduce && raf === null){ last = 0; raf = requestAnimationFrame(loop); } }
      function stop(){ if(raf !== null){ cancelAnimationFrame(raf); raf = null; } }

      var rt;
      window.addEventListener('resize', function(){ clearTimeout(rt); rt = setTimeout(resize, 120); });
      window.addEventListener('orientationchange', function(){ setTimeout(resize, 200); });
      document.addEventListener('visibilitychange', function(){ document.hidden ? stop() : start(); });

      resize();
      if(!reduce) start();
    })();
  </script>
</body>
